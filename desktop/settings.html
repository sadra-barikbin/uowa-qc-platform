<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>الإعدادات — مفتاح Anthropic API</title>
    <style>
        /* Light theme matching the main app (frontend/src/styles/global.css). */
        :root { --bg:#f9fafb; --panel:#ffffff; --text:#1f2937; --muted:#6b7280; --blue:#1a56db; --line:#e5e7eb; }
        * { box-sizing: border-box; }
        body { font-family: "Segoe UI", "Tahoma", system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding: 22px; }
        h1 { font-size: 17px; margin: 0 0 4px; }
        p.help { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin: 0 0 16px; }
        label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .row { display: flex; gap: 8px; }
        input[type=password], input[type=text] { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            color: var(--text); padding: 10px 12px; font-size: 13px; font-family: ui-monospace, monospace; direction: ltr; text-align: left; }
        input:focus { outline: none; border-color: var(--blue); }
        button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px;
            padding: 10px 14px; font-size: 13px; cursor: pointer; }
        button:hover { border-color: var(--blue); }
        button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
        button.ghost { background: transparent; }
        button.link { border: none; background: none; color: var(--muted); padding: 6px; }
        .toggle { width: 44px; }
        .actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
        .status { margin-top: 16px; font-size: 12.5px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
        .status.set { border-color: #84e1bc; background: #e3fcef; color: #046c4e; }
        .status.warn { border-color: #f8b4b4; background: #fdf2f2; color: #c81e1e; }
        .spacer { flex: 1; }
    </style>
</head>
<body>
    <h1>مفتاح Anthropic API</h1>
    <p class="help">
        يُستخدم فقط لميزة التقييم الآلي (الذكاء الاصطناعي) الاختيارية. يُخزَّن المفتاح <b>مُشفَّراً على هذا الحاسوب</b>
        (حماية حساب Windows) ولا يغادره أبداً. احصل على مفتاح من
        console.anthropic.com ← API Keys. تُطبَّق التغييرات بعد إعادة التشغيل.
    </p>

    <label for="key">مفتاح API</label>
    <div class="row">
        <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
        <button id="toggle" class="toggle ghost" title="إظهار / إخفاء">👁</button>
    </div>

    <div class="actions">
        <button id="save" class="primary">حفظ</button>
        <button id="clear" class="ghost">حذف المفتاح</button>
        <span class="spacer"></span>
        <button id="close" class="link">إغلاق</button>
    </div>

    <div id="status" class="status">جارٍ التحقق…</div>

    <script>
        const $ = (id) => document.getElementById(id);
        const statusEl = $('status');

        async function refresh() {
            const s = await window.apiKeyApi.status();
            if (!s.encryptionAvailable) {
                statusEl.className = 'status warn';
                statusEl.textContent = 'التخزين الآمن غير متوفر على هذا النظام — لا يمكن حفظ المفتاح بأمان، لذا تم تعطيل الحفظ.';
                $('save').disabled = true;
                return;
            }
            if (s.hasKey) {
                statusEl.className = 'status set';
                statusEl.textContent = 'هناك مفتاح محفوظ حالياً. أدخل مفتاحاً جديداً لاستبداله، أو احذفه.';
            } else {
                statusEl.className = 'status';
                statusEl.textContent = 'لا يوجد مفتاح محفوظ بعد. التقييم الآلي معطَّل حتى تُضيف مفتاحاً.';
            }
        }

        $('toggle').addEventListener('click', () => {
            const el = $('key');
            el.type = el.type === 'password' ? 'text' : 'password';
        });

        $('save').addEventListener('click', async () => {
            const key = $('key').value.trim();
            if (!key) { statusEl.className = 'status warn'; statusEl.textContent = 'الرجاء إدخال مفتاح API.'; return; }
            try {
                $('save').disabled = true;
                await window.apiKeyApi.save(key);
                $('key').value = '';
                await refresh();
            } catch (e) {
                statusEl.className = 'status warn';
                statusEl.textContent = (e && e.message) ? e.message : String(e);
            } finally {
                $('save').disabled = false;
            }
        });

        $('clear').addEventListener('click', async () => {
            await window.apiKeyApi.clear();
            $('key').value = '';
            await refresh();
        });

        $('close').addEventListener('click', () => window.close());

        refresh();
    </script>
</body>
</html>
