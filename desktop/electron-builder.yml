appId: iq.edu.uowa.qcplatform
productName: UOWA QC Platform
copyright: University of Warith Al-Anbiyaa — QC Unit

directories:
  output: dist
  buildResources: build

# What goes into the app bundle (asar). The backend + frontend are shipped separately as
# unpacked extraResources (below) so the forked Node server and PGlite's WASM files are real
# files on disk. electron-updater is pulled in automatically as a runtime dependency.
files:
  - main.js
  - package.json
  - "!resources/**"
  - "!scripts/**"

extraResources:
  - from: resources/backend
    to: backend
  - from: resources/frontend
    to: frontend

win:
  target: nsis
  icon: build/icon.ico   # University of Warith Al-Anbiya crest (generated by `npm run icon`)

nsis:
  oneClick: true         # single-click installer, required for silent auto-updates
  perMachine: false      # per-user install — no administrator rights needed
  allowToChangeInstallationDirectory: false

# Auto-update feed. `npm run release` uploads the installer + latest.yml to a GitHub Release;
# installed apps read this repo's Releases to find and apply updates. This is a dedicated PUBLIC
# repo holding only the installers, so downloads + auto-update work without authentication while
# the application source stays in the private uowa-qc-platform repo.
publish:
  provider: github
  owner: sadra-barikbin
  repo: uowa-qc-releases
